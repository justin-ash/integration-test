<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>500 Something went wrong</title>
  <link rel="stylesheet" href="/errors/error.css">
</head>
<body class="status-500">
  <main>
    <p class="brand">Integration Test</p>
    <p class="code" aria-hidden="true">500</p>
    <h1>Something went wrong</h1>
    <p class="message">An unexpected error occurred while handling your request. Try again, or return to the homepage.</p>
    <div class="actions">
      <a class="button" href="">Try again</a>
      <a class="button button-secondary" href="/">Go to homepage</a>
    </div>
  </main>
</body>
</html>
